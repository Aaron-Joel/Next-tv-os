name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt entpacken
        run: unzip -q "$(find . -name project.zip | head -n 1)" -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle holen
        run: |
          ok=0
          for round in 1 2 3 4 5 6 7 8; do
            for u in https://services.gradle.org/distributions/gradle-8.7-bin.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip; do
              if curl -fsSL --retry 2 --retry-all-errors --max-time 180 -o gradle.zip "$u"; then ok=1; break; fi
            done
            if [ "$ok" = 1 ]; then break; fi
            echo "Runde $round fehlgeschlagen, warte 40 Sekunden"
            sleep 40
          done
          if [ "$ok" = 1 ]; then
            unzip -q gradle.zip -d "$HOME"
            echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          else
            echo "Download nicht moeglich, nutze das vorinstallierte Gradle"
            gradle --version
          fi
      - name: APK bauen
        run: gradle -p work assembleDebug --no-daemon
      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: work/app/build/outputs/apk/debug/app-debug.apk
